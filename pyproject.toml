[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "true-dna"
version = "0.1.0"
description = "A genomic masked-language model with dual-strand sequence modeling"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "OmZeit" },
]
keywords = ["bioinformatics", "genomics", "machine-learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["true_dna"]
include = ["dna_model*"]
namespaces = true

[tool.setuptools.package-data]
dna_model = ["bpe_vocab/*.json"]

[tool.setuptools.dynamic]
dependencies = { file = ["true_dna/requirements.txt"] }

[tool.setuptools.dynamic.optional-dependencies]
benchmarks = { file = ["true_dna/requirements-benchmarks.txt"] }
dev = { file = ["true_dna/requirements-dev.txt"] }

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    ".venv",
    "true_dna/.venv",
    "true_dna/data",
    "true_dna/experiments",
    "true_dna/wandb",
    "wandb_backup",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"true_dna/scripts/**/*.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = [
    "true_dna",
    "true_dna/scripts",
]
testpaths = ["true_dna/tests"]
addopts = ["--strict-config", "--strict-markers"]
